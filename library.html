<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가치관 라이브러리 — Litmus</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="polish.css?v=2">
<script>
window.__LITMUS_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"palette":"litmus","headFont":"dm-serif","bodyFont":"noto-sans"}/*EDITMODE-END*/;
// 환경 자동 감지: 배포된 사이트에서는 이미지 ON, 작업 미리보기에서는 OFF.
window.LITMUS_HAS_IMAGES = !/claudeusercontent|claude\.ai|localhost/i.test(location.hostname);
</script>
<style>
:root{--blue:#4A80B5;--cream:#FAF8F3;--warm:#F5EFE6;--dark:#1C1917;--text:#2D2B28;--muted:#78746E;--border:#E8E0D6;--white:#FFFFFF;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 6%;height:60px;display:flex;align-items:center;justify-content:space-between;background:rgba(250,248,243,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-brand{font-family:'DM Serif Display',serif;font-size:15px;color:var(--dark);text-decoration:none;}
.nav-brand span{color:var(--blue);}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;}
.nav-back:hover{color:var(--blue);}
.hero{padding:100px 6% 48px;background:var(--dark);position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(74,128,181,0.15) 1px,transparent 1px);background-size:28px 28px;}
.hero-inner{position:relative;z-index:1;max-width:700px;}
.hero-label{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;margin-bottom:14px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:clamp(28px,4vw,46px);color:#fff;line-height:1.2;margin-bottom:16px;}
.hero-desc{font-size:15px;color:rgba(255,255,255,0.55);line-height:1.7;font-weight:300;}
.controls{padding:18px 6%;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:102px;z-index:90;}
.controls-inner{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
.top-row{display:flex;align-items:center;gap:12px;}
.search-wrap{position:relative;flex:1;max-width:340px;}
.search-input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--border);border-radius:100px;font-size:13px;font-family:inherit;background:var(--cream);color:var(--text);outline:none;}
.search-input:focus{border-color:var(--blue);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
.count{font-size:13px;color:var(--muted);margin-left:auto;}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{padding:6px 13px;border-radius:100px;border:1px solid var(--border);background:var(--white);font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.fbtn:hover{border-color:var(--blue);color:var(--blue);}
.fbtn.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.main{padding:30px 6% 80px;max-width:1260px;margin:0 auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:16px 10px 14px;text-align:center;cursor:pointer;transition:all 0.22s;position:relative;}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 32px rgba(0,0,0,0.1);border-color:var(--blue);}
.card.hide{display:none;}
.dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;}
.img-wrap{width:88px;height:88px;margin:0 auto 10px;border-radius:50%;overflow:hidden;background:var(--warm);display:flex;align-items:center;justify-content:center;}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.emoji{font-size:36px;line-height:1;}
.cname{font-size:13px;font-weight:500;color:var(--dark);margin-bottom:2px;}
.cen{font-size:11px;color:var(--muted);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.on{display:flex;}
.modal{background:var(--white);border-radius:24px;max-width:460px;width:100%;overflow:hidden;position:relative;max-height:90vh;overflow-y:auto;}
.modal-img{padding:36px 40px 28px;text-align:center;}
.modal-circle{width:150px;height:150px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--warm);}
.modal-circle img{width:100%;height:100%;object-fit:cover;}
.modal-emoji{font-size:60px;}
.modal-body{padding:0 30px 32px;}
.modal-hr{border:none;border-top:1px solid var(--border);margin:0 0 18px;}
.modal-cat{font-size:12px;font-weight:500;letter-spacing:0.05em;margin-bottom:6px;}
.modal-name{font-family:'DM Serif Display',serif;font-size:30px;color:var(--dark);margin-bottom:3px;}
.modal-en{font-size:14px;color:var(--muted);margin-bottom:18px;}
.modal-lbl{font-size:11px;color:var(--muted);margin-bottom:7px;}
.modal-def{font-size:15px;color:var(--text);line-height:1.75;}
.close-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.07);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.close-btn:hover{background:rgba(0,0,0,0.14);}
.empty{display:none;text-align:center;padding:60px;color:var(--muted);}

/* ===== 질문 맥락 선택 ===== */
.ctx-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(28,25,23,0.62);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:22px;}
.ctx-overlay.on{display:flex;animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.ctx-card{background:var(--white);border-radius:26px;max-width:540px;width:100%;padding:38px 34px 30px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,0.3);}
.ctx-eyebrow{font-size:12px;letter-spacing:0.12em;color:var(--blue);margin-bottom:12px;font-weight:500;}
.ctx-q{font-family:'DM Serif Display',serif;font-size:26px;color:var(--dark);line-height:1.3;margin-bottom:8px;}
.ctx-sub{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:26px;}
.ctx-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.ctx-opt{border:1.5px solid var(--border);border-radius:18px;padding:20px 14px;background:var(--cream);cursor:pointer;transition:all 0.2s;text-align:center;}
.ctx-opt:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,0.08);}
.ctx-opt-emoji{font-size:32px;line-height:1;margin-bottom:9px;}
.ctx-opt-name{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:3px;}
.ctx-opt-desc{font-size:11.5px;color:var(--muted);line-height:1.5;}
.ctx-back{background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;margin-bottom:16px;display:inline-flex;align-items:center;gap:4px;}
.ctx-back:hover{color:var(--blue);}
.ctx-qgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.ctx-qopt{border:1.5px solid var(--border);border-radius:18px;padding:18px 14px;background:var(--cream);cursor:pointer;transition:all 0.2s;text-align:left;}
.ctx-qopt:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,0.08);}
.ctx-qopt-tag{font-size:11px;font-weight:600;letter-spacing:0.06em;margin-bottom:6px;}
.ctx-qopt-q{font-size:13.5px;color:var(--dark);line-height:1.5;font-weight:500;}

/* 상단 맥락 칩 */
.ctx-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 13px;border-radius:100px;background:var(--dark);color:#fff;font-size:12.5px;cursor:pointer;border:none;font-family:inherit;transition:opacity 0.2s;max-width:100%;}
.ctx-chip:hover{opacity:0.88;}
.ctx-chip .chip-emoji{font-size:14px;flex-shrink:0;}
.ctx-chip .chip-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}
.ctx-chip .chip-change{font-size:11px;color:rgba(255,255,255,0.55);background:rgba(255,255,255,0.12);padding:3px 8px;border-radius:100px;flex-shrink:0;}
.ctx-question-bar{background:#EEF5FC;border-bottom:1px solid var(--border);padding:10px 6%;font-size:13.5px;color:var(--dark);line-height:1.55;display:none;position:sticky;top:60px;z-index:91;}
.ctx-question-bar.on{display:block;}
.ctx-question-bar strong{font-weight:600;}
@keyframes qbarFlash{0%{background:#4A80B5;color:#fff;}60%{background:#4A80B5;color:#fff;}100%{background:#EEF5FC;color:var(--dark);}}
.ctx-question-bar.flash{animation:qbarFlash 0.9s ease forwards;}

/* ===== 카드 선택 ===== */
.card.selected{border-color:var(--sel-col,var(--blue));box-shadow:0 0 0 2px var(--sel-col,var(--blue)) inset, 0 10px 26px rgba(0,0,0,0.08);}
.sel-toggle{position:absolute;top:9px;left:9px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);background:var(--white);color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;transition:all 0.18s;padding:0;}
.sel-toggle:hover{border-color:var(--blue);color:var(--blue);}
.card.selected .sel-toggle{background:var(--sel-col,var(--blue));border-color:var(--sel-col,var(--blue));color:#fff;}

/* 모달 선택 버튼 */
.modal-sel-btn{width:100%;margin-top:22px;padding:14px;border-radius:14px;border:1.5px solid var(--blue);background:var(--blue);color:#fff;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:all 0.2s;}
.modal-sel-btn:hover{opacity:0.9;}
.modal-sel-btn.is-sel{background:var(--white);color:var(--blue);}

/* ===== 하단 플로팅 바 ===== */
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--white);border-top:1px solid var(--border);box-shadow:0 -8px 30px rgba(0,0,0,0.08);transform:translateY(110%);transition:transform 0.34s cubic-bezier(.16,1,.3,1);}
.fbar.on{transform:translateY(0);}
.fbar-inner{max-width:1260px;margin:0 auto;padding:13px 6%;display:flex;align-items:center;gap:14px;}
.fbar-left{flex:1;min-width:0;}
.fbar-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.fbar-title{font-size:12.5px;font-weight:500;color:var(--dark);}
.fbar-cnt{font-size:11px;color:var(--muted);}
.fbar-clear{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:2px;}
.fbar-clear:hover{color:var(--blue);}
.fbar-chips{display:flex;gap:6px;flex-wrap:wrap;}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:100px;font-size:12px;color:#fff;font-weight:500;}
.fchip-active{outline:2px solid rgba(255,255,255,0.6);outline-offset:2px;}
.fbar-btns{display:flex;gap:8px;flex-shrink:0;}
.fbar-cta{flex-shrink:0;padding:13px 22px;border-radius:13px;border:none;background:var(--dark);color:#fff;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all 0.2s;white-space:nowrap;}
.fbar-cta:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.18);}
.fbar-cta:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.fbar-cta-sub{flex-shrink:0;padding:13px 18px;border-radius:13px;border:1.5px solid var(--border);background:var(--white);color:var(--text);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;display:none;align-items:center;gap:7px;transition:all 0.2s;white-space:nowrap;}
.fbar-cta-sub:hover{border-color:var(--blue);color:var(--blue);}
.fbar-cta-sub.on{display:flex;}

/* 토스트 (최대 5개 안내) */
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(16px);z-index:400;background:var(--dark);color:#fff;padding:11px 20px;border-radius:100px;font-size:13px;opacity:0;pointer-events:none;transition:all 0.3s;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== 해석 보기 오버레이 ===== */
.interp-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:250;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;}
.interp-overlay.on{display:flex;}
.interp{background:var(--white);border-radius:26px;max-width:600px;width:100%;position:relative;margin:auto;overflow:hidden;}
.interp-top{padding:30px 34px 26px;color:#fff;position:relative;}
.interp-top-label{font-size:11.5px;letter-spacing:0.08em;opacity:0.7;margin-bottom:13px;display:flex;align-items:center;gap:7px;}
.interp-statement{font-family:'DM Serif Display',serif;font-size:23px;line-height:1.42;margin-bottom:16px;}
.interp-phrases{display:flex;gap:6px;flex-wrap:wrap;}
.interp-phrase{font-size:12px;padding:5px 11px;border-radius:100px;background:rgba(255,255,255,0.18);color:#fff;}
.interp-body{padding:26px 34px 30px;}
.interp-sec-lbl{font-size:11px;letter-spacing:0.06em;color:var(--muted);margin-bottom:14px;text-transform:uppercase;}
.interp-mix{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px;}
.mix-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text);}
.mix-dot{width:9px;height:9px;border-radius:50%;}
.mix-item b{font-weight:700;}
.mix-item span{color:var(--muted);font-size:11px;}

/* 방향성 축 */
.axis{margin-bottom:20px;}
.axis-labels{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;}
.axis-labels b{font-weight:700;color:var(--dark);}
.axis-labels .dim{color:var(--muted);font-weight:400;}
.axis-track{position:relative;height:8px;border-radius:100px;background:var(--warm);}
.axis-fill{position:absolute;top:0;bottom:0;border-radius:100px;background:var(--blue);transition:all 0.5s ease;}
.axis-marker{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--white);border:3px solid var(--dark);transform:translate(-50%,-50%);transition:left 0.5s cubic-bezier(.16,1,.3,1);box-shadow:0 2px 6px rgba(0,0,0,0.2);}
.axis-note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6;}
.axis-note b{color:var(--dark);font-weight:500;}

/* 기록하기 */
.record{margin-top:26px;padding-top:24px;border-top:1px solid var(--border);}
.record-lbl{font-size:14px;font-weight:500;color:var(--dark);margin-bottom:4px;}
.record-hint{font-size:12px;color:var(--muted);margin-bottom:13px;}
.record-row{display:flex;gap:9px;}
.record-input{flex:1;padding:13px 15px;border:1.5px solid var(--border);border-radius:13px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--text);outline:none;resize:none;line-height:1.5;}
.record-input:focus{border-color:var(--blue);}
.record-save{flex-shrink:0;padding:0 20px;border-radius:13px;border:none;background:var(--blue);color:#fff;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;transition:all 0.2s;}
.record-save:hover{opacity:0.9;}
.record-save.saved{background:var(--green,#2DA06B);}
.record-cap{display:flex;align-items:center;gap:8px;margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--warm);font-size:12.5px;color:var(--muted);line-height:1.5;}
.record-cap .cap-emoji{font-size:16px;}

@media(max-width:600px){
  .ctx-grid{grid-template-columns:1fr;}
  .fbar-inner{flex-direction:column;align-items:stretch;gap:11px;padding:13px 5%;}
  .fbar-cta{justify-content:center;}
  .interp-top{padding:26px 22px 22px;}
  .interp-body{padding:22px 22px 26px;}
  .interp-statement{font-size:20px;}
  .record-row{flex-direction:column;}
  .record-save{padding:13px;}
}
</style>
</head>
<body>
<nav>
  <a class="nav-back" href="index.html">← 홈으로</a>
  <a class="nav-brand" href="index.html">가치관 실험실 <span>"Litmus"</span></a>
</nav>
<div class="hero">
  <div class="hero-inner">
    <div class="hero-label">VALUE LIBRARY · 가치관 라이브러리</div>
    <h1 class="hero-title">지금 나에게 중요한<br>가치는 무엇인가요?</h1>
    <p class="hero-desc">인간의 보편적 욕구와 삶의 방향을 담은 탐색 공간입니다.<br>끌리는 가치 카드를 클릭해 천천히 탐색해보세요.</p>
  </div>
</div>
<div class="ctx-question-bar" id="ctxQuestionBar"></div>
<div class="controls">
  <div class="controls-inner">
    <div class="top-row">
      <button class="ctx-chip" id="ctxChip" style="display:none;"></button>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="q" type="text" placeholder="가치 이름 검색...">
      </div>
      <span class="count" id="cnt"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</div>
<div class="main">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">검색 결과가 없어요 🔍</div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="modal-img" id="mImg"></div>
    <div class="modal-body">
      <hr class="modal-hr">
      <div class="modal-cat" id="mCat"></div>
      <div class="modal-name" id="mName"></div>
      <div class="modal-en" id="mEn"></div>
      <div class="modal-lbl">가치 정의</div>
      <div class="modal-def" id="mDef"></div>
      <button class="modal-sel-btn" id="modalSelBtn"></button>
    </div>
  </div>
</div>

<!-- 질문 맥락 선택 오버레이 -->
<div class="ctx-overlay" id="ctxOverlay">
  <div class="ctx-card">
    <!-- Step 1: 주제 선택 -->
    <div id="ctxStep1">
      <div class="ctx-eyebrow">QUESTION CARD</div>
      <h2 class="ctx-q">어떤 주제로<br>탐색하고 있나요?</h2>
      <p class="ctx-sub">오프라인에서 사용한 질문카드의 주제를 선택해주세요.</p>
      <div class="ctx-grid" id="ctxGrid"></div>
    </div>
    <!-- Step 2: 질문카드 선택 -->
    <div id="ctxStep2" style="display:none;">
      <button class="ctx-back" id="ctxBackBtn">← 주제 다시 선택</button>
      <div class="ctx-eyebrow" id="ctxStep2Eyebrow"></div>
      <h2 class="ctx-q">어떤 질문카드를<br>사용했나요?</h2>
      <p class="ctx-sub">순서대로 탐색해보세요. 2개 이상 완료하면 결과를 볼 수 있어요.</p>
      <div class="ctx-qgrid" id="ctxQGrid"></div>
    </div>
  </div>
</div>

<!-- 하단 플로팅 바 -->
<div class="fbar" id="fbar">
  <div class="fbar-inner">
    <div class="fbar-left">
      <div class="fbar-head">
        <span class="fbar-title">선택한 가치</span>
        <span class="fbar-cnt" id="fbarCnt">0 / 4</span>
        <button class="fbar-clear" id="fbarClear">전체 해제</button>
      </div>
      <div class="fbar-chips" id="fbarChips"></div>
    </div>
    <div class="fbar-btns">
      <button class="fbar-cta-sub" id="nextQBtn">다음 질문 →</button>
      <button class="fbar-cta" id="interpBtn">해석 보기 →</button>
    </div>
  </div>
</div>

<!-- 해석 보기 오버레이 -->
<div class="interp-overlay" id="interpOverlay">
  <div class="interp">
    <button class="close-btn" id="interpClose" style="z-index:3;">✕</button>
    <div class="interp-top" id="interpTop"></div>
    <div class="interp-body" id="interpBody"></div>
  </div>
</div>

function getCatKey(c) {
  for (var k in CAT_MAP) { if (CAT_MAP[k] === c) return k; }
  return '';
}

var activeFilter = '전체';
var cards = [];

// 필터 버튼
var fWrap = document.getElementById('filters');
CATS.forEach(function(label) {
  var btn = document.createElement('button');
  btn.className = 'fbtn' + (label === '전체' ? ' on' : '');
  btn.textContent = label;
  btn.onclick = function() {
    activeFilter = label;
    document.querySelectorAll('.fbtn').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    doFilter();
  };
  fWrap.appendChild(btn);
});

// 카드 생성
var grid = document.getElementById('grid');
DATA.forEach(function(v, idx) {
  var catKey = getCatKey(v.c);
  var color = COL[catKey] || '#888';
  var emoji = EMOJI[v.n] || '🔵';
  var card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-n', v.n);
  card.setAttribute('data-e', v.e.toLowerCase());
  card.setAttribute('data-c', v.c);
  card.setAttribute('data-idx', idx);
  card.style.setProperty('--sel-col', color);

  var toggle = document.createElement('button');
  toggle.className = 'sel-toggle';
  toggle.innerHTML = '+';
  toggle.title = '이 가치 선택하기';
  toggle.onclick = (function(i, e) {
    return function(ev) { ev.stopPropagation(); toggleSelect(i, e); };
  })(idx, undefined);

  var dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.background = color;

  var iw = document.createElement('div');
  iw.className = 'img-wrap';
  if (v.f && window.LITMUS_HAS_IMAGES) {
    var img = document.createElement('img');
    img.alt = v.n;
    img.src = 'images/' + v.f;
    img.onerror = (function(wrap, em) {
      return function() { wrap.innerHTML = '<span class="emoji">' + em + '</span>'; };
    })(iw, emoji);
    iw.appendChild(img);
  } else {
    iw.innerHTML = '<span class="emoji">' + emoji + '</span>';
  }

  var nm = document.createElement('div');
  nm.className = 'cname';
  nm.textContent = v.n;
  var en = document.createElement('div');
  en.className = 'cen';
  en.textContent = v.e;

  card.appendChild(toggle);
  card.appendChild(dot);
  card.appendChild(iw);
  card.appendChild(nm);
  card.appendChild(en);
  card.onclick = (function(vv, ck, col) {
    return function() { openModal(vv, ck, col); };
  })(v, catKey, color);

  grid.appendChild(card);
  cards.push(card);
});

document.getElementById('cnt').textContent = DATA.length + '개';

function doFilter() {
  var q = document.getElementById('q').value.toLowerCase();
  var catVal = CAT_MAP[activeFilter] || null;
  var count = 0;
  cards.forEach(function(card) {
    var ok = (card.getAttribute('data-n').indexOf(q) >= 0 || card.getAttribute('data-e').indexOf(q) >= 0)
             && (!catVal || card.getAttribute('data-c') === catVal);
    card.classList.toggle('hide', !ok);
    if (ok) count++;
  });
  document.getElementById('cnt').textContent = count + '개';
  document.getElementById('empty').style.display = count === 0 ? 'block' : 'none';
}

document.getElementById('q').addEventListener('input', doFilter);

function openModal(v, catKey, color) {
  var emoji = EMOJI[v.n] || '🔵';
  var mImg = document.getElementById('mImg');
  mImg.innerHTML = '';
  mImg.style.background = color + '15';
  var circle = document.createElement('div');
  circle.className = 'modal-circle';
  if (v.f && window.LITMUS_HAS_IMAGES) {
    var img = document.createElement('img');
    img.alt = v.n;
    img.src = 'images/' + v.f;
    img.onerror = (function(c, em) {
      return function() { c.innerHTML = '<span class="modal-emoji">' + em + '</span>'; };
    })(circle, emoji);
    circle.appendChild(img);
  } else {
    circle.innerHTML = '<span class="modal-emoji">' + emoji + '</span>';
  }
  mImg.appendChild(circle);
  document.getElementById('mCat').textContent = catKey + ' 가치';
  document.getElementById('mCat').style.color = color;
  document.getElementById('mName').textContent = v.n;
  document.getElementById('mEn').textContent = v.e;
  document.getElementById('mDef').textContent = v.d;
  currentModalIdx = DATA.indexOf(v);
  updateModalSelBtn();
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('on');
  document.body.style.overflow = '';
}

document.getElementById('closeBtn').onclick = closeModal;
document.getElementById('overlay').onclick = function(e) {
  if (e.target === this) closeModal();
};
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); closeInterp(); }
});

var GROWTH     = ['자율','자극','쾌락주의','성취','보편주의'];
var STABILITY  = ['안전','동조','전통'];

function catOf(idx){ return getCatKey(DATA[idx].c); }
function colOf(idx){ return COL[catOf(idx)] || '#888'; }

/* ---------- 질문 맥락 ---------- */

(function initContext(){
  // Step1: 주제 3개
  var g = document.getElementById('ctxGrid');
  Object.keys(CONTEXTS).forEach(function(key){
    var c = CONTEXTS[key];
    var b = document.createElement('div');
    b.className = 'ctx-opt';
    b.innerHTML = '<div class="ctx-opt-emoji">'+c.emoji+'</div>'+
                  '<div class="ctx-opt-name">'+c.name+'</div>';
    b.onclick = function(){ showStep2(key); };
    g.appendChild(b);
  });

  // 항상 오버레이 띄우기 (매 진입마다 주제·질문 선택)
  document.getElementById('ctxOverlay').classList.add('on');
})();

function showStep2(themeKey){
  var c = CONTEXTS[themeKey];
  document.getElementById('ctxStep1').style.display = 'none';
  document.getElementById('ctxStep2').style.display = 'block';
  document.getElementById('ctxStep2Eyebrow').textContent = c.emoji + ' ' + c.name + ' 질문카드';
  var qg = document.getElementById('ctxQGrid');
  qg.innerHTML = '';
  QUESTIONS[themeKey].forEach(function(q){
    var b = document.createElement('div');
    b.className = 'ctx-qopt';
    b.innerHTML = '<div class="ctx-qopt-tag" style="color:'+getThemeColor(themeKey)+'">'+q.tag+'</div>'+
                  '<div class="ctx-qopt-q">'+q.q+'</div>';
    b.onclick = function(){ setContext(themeKey, q); };
    qg.appendChild(b);
  });
}

document.getElementById('ctxBackBtn').onclick = function(){
  document.getElementById('ctxStep2').style.display = 'none';
  document.getElementById('ctxStep1').style.display = 'block';
};

function getThemeColor(key){
  return key === 'love' ? '#E8457A' : key === 'career' ? '#F07C00' : '#2DA06B';
}

// 오버레이에서 질문카드 선택 시 — 새 주제/질문 시작
function setContext(themeKey, q){
  // 주제가 바뀌면 선택 리셋, 같은 주제면 유지하고 해당 질문으로 이동
  if (currentCtx !== themeKey) {
    selected = {};
    persistSel();
  }
  applyContext(themeKey, q);
}

// UI 적용 (리셋 없이 상태만 반영)
function applyContext(themeKey, q){
  currentCtx = themeKey;
  currentQKey = q.key;
  localStorage.setItem(LS.ctx, q.key);
  var c = CONTEXTS[themeKey];

  // 상단 칩
  var chip = document.getElementById('ctxChip');
  chip.style.display = 'inline-flex';
  chip.innerHTML = '<span class="chip-emoji">'+c.emoji+'</span>'+
                   '<span class="chip-label">'+c.name+' · '+q.tag+'</span>'+
                   '<span class="chip-change">변경</span>';

  // 질문 바
  updateQuestionBar();

  // 필터·검색 초기화
  document.getElementById('q').value = '';
  activeFilter = '전체';
  document.querySelectorAll('.fbtn').forEach(function(b){
    b.classList.toggle('on', b.textContent === '전체');
  });
  doFilter();

  // 오버레이 닫기 & Step 초기화
  document.getElementById('ctxOverlay').classList.remove('on');
  document.getElementById('ctxStep2').style.display = 'none';
  document.getElementById('ctxStep1').style.display = 'block';

  syncSelUI();
}

// 질문 바 텍스트 갱신
function updateQuestionBar(){
  if (!currentCtx || !currentQKey) return;
  var qs = QUESTIONS[currentCtx];
  var q = qs && qs.find(function(x){ return x.key === currentQKey; });
  if (!q) return;
  var bar = document.getElementById('ctxQuestionBar');
  var qIdx = qs.indexOf(q);
  bar.className = 'ctx-question-bar on';
  bar.innerHTML =
    '<span style="font-size:11px;color:var(--muted);margin-right:8px;">질문 '+(qIdx+1)+' / '+qs.length+'</span>'+
    '<strong>'+q.tag+'</strong> — '+q.full;
}

document.getElementById('ctxChip').onclick = function(){
  document.getElementById('ctxOverlay').classList.add('on');
};
document.getElementById('ctxOverlay').onclick = function(e){
  if (e.target === this && currentCtx) this.classList.remove('on');
};

/* ---------- 가치 선택 ---------- */
function toggleSelect(idx){
  if (!currentQKey) { showToast('먼저 질문카드를 선택해주세요'); return; }
  // 이미 이 질문에 같은 값이면 해제만 (자동 이동 없음)
  if (selected[currentQKey] === idx) {
    delete selected[currentQKey];
    persistSel();
    syncSelUI();
    return;
  }
  // 새 가치 선택 → 저장 후 다음 미선택 질문으로 자동 이동
  selected[currentQKey] = idx;
  persistSel();
  syncSelUI();
  setTimeout(function(){ goNextUnselected(); }, 320);
}
function clearSelection(){
  selected = {};
  persistSel();
  syncSelUI();
}
function persistSel(){ localStorage.setItem(LS.sel, JSON.stringify(selected)); }

// 선택된 값을 순서 배열로 반환 (현재 테마 기준)
function selectedValues(){
  if (!currentCtx) return [];
  return QUESTIONS[currentCtx].map(function(q){ return selected[q.key]; })
                               .filter(function(v){ return v !== undefined; });
}
// 총 선택 수
function selectedCount(){
  return Object.keys(selected).length;
}

function syncSelUI(){
  cards.forEach(function(card){
    var i = parseInt(card.getAttribute('data-idx'),10);
    // 현재 질문의 선택값과 비교
    var on = (selected[currentQKey] === i);
    card.classList.toggle('selected', on);
    card.querySelector('.sel-toggle').innerHTML = on ? '✓' : '+';
  });
  renderFbar();
  updateModalSelBtn();
}



function renderFbar(){
  if (!currentCtx || !currentQKey) {
    document.getElementById('fbar').classList.remove('on');
    return;
  }
  var qs = QUESTIONS[currentCtx];
  var qIdx = qs.findIndex(function(q){ return q.key === currentQKey; });
  var totalDone = selectedCount();
  var allDone = (totalDone === qs.length);
  var enoughDone = (totalDone >= 2);

  document.getElementById('fbar').classList.add('on');

  // 현재 질문 선택 여부
  var curSel = selected[currentQKey];

  // 카운트 표시
  document.getElementById('fbarCnt').textContent = totalDone + ' / ' + qs.length;

  // 칩 영역 — 완료된 이전 질문들
  var wrap = document.getElementById('fbarChips');
  wrap.innerHTML = '';
  qs.forEach(function(q, i){
    var val = selected[q.key];
    if (val === undefined) return; // 미선택 질문은 칩 없음
    var isCurrent = (q.key === currentQKey);
    var chip = document.createElement('span');
    chip.className = 'fchip' + (isCurrent ? ' fchip-active' : '');
    chip.style.background = colOf(val);
    chip.style.cursor = 'pointer';
    chip.title = q.tag + ' 질문으로 돌아가기';
    chip.innerHTML =
      '<span style="font-size:10px;opacity:0.7;margin-right:2px;">Q'+(i+1)+'</span>'+
      DATA[val].n;
    // 칩 클릭 → 해당 질문으로 이동
    chip.onclick = (function(qObj){
      return function(){ goToQuestion(qObj.key); };
    })(q);
    wrap.appendChild(chip);
  });

  // CTA 버튼
  var btn = document.getElementById('interpBtn');
  var nextBtn = document.getElementById('nextQBtn');
  var hasUnselected = qs.some(function(q){ return selected[q.key] === undefined; });

  // 결과보기 버튼
  if (enoughDone) {
    btn.textContent = allDone ? '해석 보기 →' : '지금 결과 보기 →';
    btn.disabled = false;
    btn.onclick = goToResult;
  } else {
    btn.textContent = '가치를 선택해주세요 (2개 이상)';
    btn.disabled = true;
    btn.onclick = null;
  }

  // 다음 질문 버튼 — 미선택 질문이 있을 때만 표시
  if (hasUnselected && enoughDone) {
    nextBtn.classList.add('on');
    nextBtn.onclick = goNextUnselected;
  } else {
    nextBtn.classList.remove('on');
    nextBtn.onclick = null;
  }
}

// 질문 바 flash
function flashQuestionBar(){
  var bar = document.getElementById('ctxQuestionBar');
  bar.classList.remove('flash');
  void bar.offsetWidth; // reflow로 animation 재시작
  bar.classList.add('flash');
}

// 미선택 질문 중 첫 번째로 이동 (없으면 아무것도 안 함)
function goNextUnselected(){
  if (!currentCtx) return;
  var qs = QUESTIONS[currentCtx];
  var next = qs.find(function(q){ return selected[q.key] === undefined; });
  if (next) {
    goToQuestion(next.key);
    flashQuestionBar();
  }
  // 모두 선택됐으면 자동 이동 없이 fbar에서 결과보기 버튼 활성화만
  renderFbar();
}

// 다음 질문으로 전환
function goNextQuestion(){
  if (!currentCtx) return;
  var qs = QUESTIONS[currentCtx];
  var idx = qs.findIndex(function(q){ return q.key === currentQKey; });
  if (idx < qs.length - 1) {
    currentQKey = qs[idx + 1].key;
    localStorage.setItem(LS.ctx, currentQKey);
    updateQuestionBar();
    flashQuestionBar();
    updateCtxChip();
    // 필터·검색 초기화
    document.getElementById('q').value = '';
    activeFilter = '전체';
    document.querySelectorAll('.fbtn').forEach(function(b){
      b.classList.toggle('on', b.textContent === '전체');
    });
    doFilter();
    syncSelUI();
    // 스크롤 상단
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

// 특정 질문 키로 이동 (칩 클릭)
function goToQuestion(qKey){
  currentQKey = qKey;
  localStorage.setItem(LS.ctx, qKey);
  updateQuestionBar();
  flashQuestionBar();
  updateCtxChip();
  document.getElementById('q').value = '';
  activeFilter = '전체';
  document.querySelectorAll('.fbtn').forEach(function(b){
    b.classList.toggle('on', b.textContent === '전체');
  });
  doFilter();
  syncSelUI();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// 상단 칩 텍스트 갱신
function updateCtxChip(){
  if (!currentCtx || !currentQKey) return;
  var qs = QUESTIONS[currentCtx];
  var q = qs && qs.find(function(x){ return x.key === currentQKey; });
  if (!q) return;
  var c = CONTEXTS[currentCtx];
  var chip = document.getElementById('ctxChip');
  chip.style.display = 'inline-flex';
  chip.innerHTML = '<span class="chip-emoji">'+c.emoji+'</span>'+
                   '<span class="chip-label">'+c.name+' · '+q.tag+'</span>'+
                   '<span class="chip-change">변경</span>';
}

// result.html 이동
function goToResult(){
  if (!currentCtx) return;
  var qs = QUESTIONS[currentCtx];
  var vals = qs.map(function(q){ return selected[q.key]; })
               .filter(function(v){ return v !== undefined; });
  if (vals.length === 0) return;
  var url = 'result.html?theme=' + currentCtx + '&v=' + vals.join(',');
  window.location.href = url;
}

document.getElementById('fbarClear').onclick = clearSelection;

/* 모달 선택 버튼 */
function updateModalSelBtn(){
  var btn = document.getElementById('modalSelBtn');
  if (currentModalIdx < 0) return;
  var on = (selected[currentQKey] === currentModalIdx);
  btn.classList.toggle('is-sel', on);
  btn.textContent = on ? '✓ 선택됨 — 해제하기' : '＋ 이 가치 선택하기';
}
document.getElementById('modalSelBtn').onclick = function(){
  if (currentModalIdx >= 0) {
    toggleSelect(currentModalIdx);
    closeModal();
  }
};

/* 토스트 */
var toastTimer;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* ---------- 해석 보기 ---------- */
document.getElementById('interpClose').onclick = closeInterp;
document.getElementById('interpOverlay').onclick = function(e){
  if (e.target === this) closeInterp();
};

function countIn(set){
  return Object.values(selected).filter(function(i){ return set.indexOf(catOf(i)) >= 0; }).length;
}

function openInterp(){
  var vals = Object.values(selected);
  if (!vals.length) return;

  // 1) 카테고리(컬러) 빈도 집계 → 가장 많이 선택된 카테고리
  var counts = {};
  vals.forEach(function(i){ var k = catOf(i); counts[k] = (counts[k]||0)+1; });
  var dom = null, domN = 0;
  selected.forEach(function(i){
    var k = catOf(i);
    if (counts[k] > domN) { domN = counts[k]; dom = k; }
  });
  var domCol = COL[dom] || '#444';
  var info = CAT_INTERP[dom];

  // 상단 (지배 카테고리 해석)
  var ctx = CONTEXTS[currentCtx];
  var top = document.getElementById('interpTop');
  top.style.background = domCol;
  top.innerHTML =
    '<div class="interp-top-label">'+
      (ctx ? ctx.emoji+' '+ctx.name+' · ' : '')+
      '가장 두드러진 가치 — '+dom+'</div>'+
    '<div class="interp-statement">'+info.s+'</div>'+
    '<div class="interp-phrases">'+
      info.p.map(function(x){ return '<span class="interp-phrase">'+x+'</span>'; }).join('')+
    '</div>';

  // 본문: 카테고리 구성 + 방향성 축
  var mix = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).map(function(k){
    return '<span class="mix-item"><span class="mix-dot" style="background:'+COL[k]+'"></span>'+
           '<b>'+k+'</b> <span>'+counts[k]+'</span></span>';
  }).join('');

  var g = countIn(GROWTH), st = countIn(STABILITY);
  var ind = countIn(INDIVIDUAL), soc = countIn(SOCIAL);

  var body = document.getElementById('interpBody');
  body.innerHTML =
    '<div class="interp-sec-lbl">선택한 가치의 구성</div>'+
    '<div class="interp-mix">'+mix+'</div>'+
    '<div class="interp-sec-lbl">나의 방향성</div>'+
    axisHTML('성장', '안정', g, st)+
    axisHTML('개인', '사회', ind, soc)+
    recordHTML();

  bindRecord();
  document.getElementById('interpOverlay').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function axisHTML(leftLbl, rightLbl, leftN, rightN){
  var tot = leftN + rightN;
  var pct = tot > 0 ? Math.round(rightN/tot*100) : 50; // 0=왼쪽, 100=오른쪽
  // 중앙(50%)에서 마커까지 채움
  var fillLeft = Math.min(pct,50), fillW = Math.abs(pct-50);
  var lean, note;
  if (tot === 0) { lean = '균형'; note = '이 축에 해당하는 가치가 없어요.'; }
  else if (pct < 42) { lean = leftLbl; }
  else if (pct > 58) { lean = rightLbl; }
  else { lean = '균형'; }
  if (tot > 0) {
    note = '<b>'+leftLbl+'</b> '+leftN+' · <b>'+rightLbl+'</b> '+rightN+
           ' — 당신의 가치들은 <b>'+lean+'</b>'+(lean==='균형'?' 지점에':' 쪽으로')+' 기울어 있어요.';
  }
  return '<div class="axis">'+
    '<div class="axis-labels"><span class="'+(lean===leftLbl?'':'dim')+'"><b>'+leftLbl+'</b></span>'+
      '<span class="'+(lean===rightLbl?'':'dim')+'"><b>'+rightLbl+'</b></span></div>'+
    '<div class="axis-track">'+
      '<div class="axis-fill" style="left:'+fillLeft+'%;width:'+fillW+'%;"></div>'+
      '<div class="axis-marker" style="left:'+pct+'%;"></div>'+
    '</div>'+
    '<div class="axis-note">'+note+'</div>'+
  '</div>';
}

/* ---------- 기록하기 ---------- */
function recordHTML(){
  var saved = localStorage.getItem(LS.rec) || '';
  return '<div class="record">'+
    '<div class="record-lbl">오늘 발견한 나의 가치관을 한 줄로 적어보세요</div>'+
    '<div class="record-hint">짧은 문장이어도 좋아요. 지금의 마음을 남겨두면 다음에 비교할 수 있어요.</div>'+
    '<div class="record-row">'+
      '<textarea class="record-input" id="recInput" rows="2" placeholder="예: 나는 새로움 속에서 나답게 살고 싶다.">'+
        saved.replace(/</g,'&lt;')+'</textarea>'+
      '<button class="record-save" id="recSave">저장</button>'+
    '</div>'+
    '<div class="record-cap"><span class="cap-emoji">📸</span>'+
      '이 화면을 캡처해서 기록해두면, 오늘의 가치관을 오래 간직할 수 있어요.</div>'+
  '</div>';
}
function bindRecord(){
  var input = document.getElementById('recInput');
  var btn = document.getElementById('recSave');
  if (!input || !btn) return;
  btn.onclick = function(){
    localStorage.setItem(LS.rec, input.value);
    btn.textContent = '저장됨 ✓';
    btn.classList.add('saved');
    setTimeout(function(){ btn.textContent = '저장'; btn.classList.remove('saved'); }, 1800);
  };
}

function closeInterp(){
  document.getElementById('interpOverlay').classList.remove('on');
  document.body.style.overflow = '';
}

/* ---------- 초기 복원 ---------- */
(function restore(){
  try {
    var s = JSON.parse(localStorage.getItem(LS.sel) || '{}');
    if (s && typeof s === 'object' && !Array.isArray(s)) {
      selected = {};
      Object.keys(s).forEach(function(k){
        var v = s[k];
        if (typeof v === 'number' && v >= 0 && v < DATA.length) selected[k] = v;
      });
    }
  } catch(e){ selected = {}; }
  syncSelUI();
})();
