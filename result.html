<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 가치관 해석 — Litmus</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4A80B5;--blue-light:#D6E8F7;--blue-dark:#2C5F8A;
  --cream:#FAF8F3;--warm:#F5EFE6;--dark:#1C1917;
  --text:#2D2B28;--muted:#78746E;--border:#E8E0D6;--white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--text);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:60px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:rgba(250,248,243,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-brand{font-family:'DM Serif Display',serif;font-size:15px;color:var(--dark);text-decoration:none;}
.nav-brand span{color:var(--blue);}
.nav-reset{font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:color 0.2s;}
.nav-reset:hover{color:var(--blue);}

/* HERO */
.hero{padding:90px 6% 40px;background:var(--dark);position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(74,128,181,0.15) 1px,transparent 1px);background-size:28px 28px;}
.hero-inner{position:relative;z-index:1;max-width:700px;}
.hero-theme{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;margin-bottom:12px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:clamp(24px,3.5vw,38px);color:#fff;line-height:1.25;margin-bottom:12px;white-space:pre-line;}
.hero-sub{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.7;font-weight:300;}

/* MAIN */
.main{max-width:720px;margin:0 auto;padding:40px 6% 80px;}

/* 섹션 공통 */
.sec{margin-bottom:32px;}
.sec-label{font-size:11px;font-weight:500;letter-spacing:0.08em;color:var(--blue);text-transform:uppercase;margin-bottom:14px;}
.sec-card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:28px;}

/* 상단 요약 */
.summary-list{display:flex;flex-direction:column;gap:10px;}
.summary-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--cream);border-radius:12px;}
.summary-tag{font-size:11px;font-weight:600;letter-spacing:0.05em;min-width:36px;}
.summary-arrow{color:var(--muted);font-size:14px;flex-shrink:0;}
.summary-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.summary-name{font-size:15px;font-weight:500;color:var(--dark);}
.summary-cat{font-size:11px;color:var(--muted);margin-left:4px;}

/* 방향성 */
.axis{margin-bottom:22px;}
.axis:last-child{margin-bottom:0;}
.axis-labels{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;}
.axis-labels b{font-weight:700;color:var(--dark);}
.axis-labels .dim b{color:var(--muted);font-weight:400;}
.axis-track{position:relative;height:8px;border-radius:100px;background:var(--warm);}
.axis-fill{position:absolute;top:0;bottom:0;border-radius:100px;background:var(--blue);}
.axis-marker{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--white);border:3px solid var(--dark);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,0.2);}
.axis-note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6;}
.axis-note b{color:var(--dark);font-weight:500;}

/* 컬러 해석 */
.color-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.color-circle{width:44px;height:44px;border-radius:50%;flex-shrink:0;}
.color-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--dark);}
.color-sub{font-size:13px;color:var(--muted);margin-top:2px;}
.color-statement{font-size:15px;color:var(--dark);line-height:1.75;margin-bottom:16px;padding:16px;background:var(--cream);border-radius:12px;border-left:3px solid var(--blue);}
.color-tags{display:flex;gap:7px;flex-wrap:wrap;}
.color-tag{font-size:12px;padding:5px 12px;border-radius:100px;background:var(--warm);color:var(--text);}

/* 상황별 해석 */
.ctx-interp{font-size:15px;color:var(--text);line-height:1.8;font-weight:300;}
.ctx-interp strong{font-weight:500;color:var(--dark);}

/* 다시하기 버튼 */
.reset-btn{display:block;text-align:center;margin:0 auto;padding:14px 32px;border-radius:100px;background:var(--dark);color:#fff;font-size:14px;font-weight:500;text-decoration:none;font-family:inherit;border:none;cursor:pointer;transition:all 0.2s;}
.reset-btn:hover{background:#333;transform:translateY(-2px);}

/* 에러 */
.error{text-align:center;padding:80px 20px;color:var(--muted);}
.error h2{font-family:'DM Serif Display',serif;font-size:28px;color:var(--dark);margin-bottom:12px;}

/* 히어로 하단 링크 */
.hero-back{display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:13px;color:rgba(255,255,255,0.45);text-decoration:none;transition:color 0.2s;}
.hero-back:hover{color:rgba(255,255,255,0.85);}

/* 캡처 안내 */
.capture-box{display:flex;align-items:flex-start;gap:12px;background:var(--warm);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-top:32px;}
.capture-icon{font-size:22px;flex-shrink:0;line-height:1;margin-top:1px;}
.capture-text{font-size:13px;color:var(--muted);line-height:1.65;}
.capture-text strong{color:var(--dark);font-weight:500;display:block;margin-bottom:2px;}
</style>
</head>
<body>

<nav>

  '성취':   {love:'함께 성장하며 서로의 목표를 응원하는 관계를 선호합니다. 미래를 함께 그려나갈 수 있는 상대에게 끌립니다.',career:'명확한 목표와 성과 기준이 있을 때 가장 빠르게 성장합니다. 도전적인 목표를 달성하며 성취감을 느낍니다.',life:'목표를 이루고 성장하는 경험이 삶의 중요한 원동력이 되고 있습니다.'},
  '보편주의':{love:'서로의 가치관과 생각을 존중하는 관계를 원합니다. 깊이 있는 대화와 진정성 있는 연결을 중요하게 여깁니다.',career:'의미와 가치, 사회적 기여를 느낄 수 있는 일에 몰입합니다. 환경, 교육, 공익, 연구와 같은 분야와 잘 맞습니다.',life:'무엇이 진정으로 의미 있는 삶인지 고민하게 되는 시기입니다.'},
  '권력':   {love:'주도성과 책임감을 가진 관계를 선호합니다. 서로 존중하며 신뢰할 수 있는 관계에서 안정감을 느낍니다.',career:'리더십과 전략, 의사결정이 필요한 역할에서 강점을 발휘합니다. 영향력을 발휘하며 조직을 이끄는 역할에 적합합니다.',life:'삶의 주도권을 되찾고 자신의 영향력을 확장하고 싶은 시기입니다.'}
};

var GROWTH     = ['자율','자극','쾌락주의','성취','보편주의'];
var STABILITY  = ['안전','동조','전통'];
var INDIVIDUAL = ['자율','자극','쾌락주의','성취','권력'];
var SOCIAL     = ['박애','보편주의','동조','전통','안전'];

var QUESTIONS = {
  love:   [{key:'love_1',tag:'끌림'},{key:'love_2',tag:'갈등'},{key:'love_3',tag:'신뢰'},{key:'love_4',tag:'선택'}],
  career: [{key:'career_1',tag:'선택'},{key:'career_2',tag:'점검'},{key:'career_3',tag:'변화'},{key:'career_4',tag:'미래'}],
  life:   [{key:'life_1',tag:'과거'},{key:'life_2',tag:'현재'},{key:'life_3',tag:'관계'},{key:'life_4',tag:'방향'}]
};

var THEME_LABEL = {love:'💙 연애', career:'🧡 진로', life:'💚 인생'};
var THEME_CTX_KEY = {love:'love', career:'career', life:'life'};

/* ===== URL 파싱 ===== */
function getParams(){
  var p = new URLSearchParams(location.search);
  var theme = p.get('theme');
  var v = p.get('v');
  if (!theme || !v) return null;
  var idxs = v.split(',').map(Number).filter(function(n){ return !isNaN(n) && n >= 0 && n < DATA.length; });
  if (!idxs.length) return null;
  return {theme: theme, idxs: idxs};
}

/* ===== 헬퍼 ===== */
function getCatKey(c){
  for (var k in CAT_MAP){ if (CAT_MAP[k] === c) return k; }
  return '';
}
function catOf(idx){ return getCatKey(DATA[idx].c); }
function colOf(idx){ return COL[catOf(idx)] || '#888'; }

/* ===== 렌더링 ===== */
function render(){
  var params = getParams();
  var main = document.getElementById('main');

  if (!params){
    main.innerHTML = '<div class="error"><h2>앗, 데이터가 없어요</h2><p>library 페이지에서 가치를 선택하고 다시 시도해주세요.</p><br><a class="reset-btn" href="library-choice.html">가치 선택하러 가기</a></div>';
    return;
  }

  var theme = params.theme;
  var idxs = params.idxs;
  var qs = QUESTIONS[theme] || [];

  // 히어로
  document.getElementById('heroTheme').textContent = (THEME_LABEL[theme] || theme).toUpperCase() + ' · 가치관 해석 결과';
  document.getElementById('heroTitle').textContent = '지금 나를 움직이는\n가치들입니다';

  var html = '';

  /* ① 상단 요약 */
  html += '<div class="sec">';
  html += '<div class="sec-label">선택한 가치</div>';
  html += '<div class="sec-card"><div class="summary-list">';
  idxs.forEach(function(idx, i){
    var v = DATA[idx];
    var cat = catOf(idx);
    var col = colOf(idx);
    var tag = qs[i] ? qs[i].tag : (i+1)+'번';
    html += '<div class="summary-item">';
    html += '<span class="summary-tag" style="color:'+col+'">'+tag+'</span>';
    html += '<span class="summary-arrow">→</span>';
    html += '<span class="summary-dot" style="background:'+col+'"></span>';
    html += '<span class="summary-name">'+v.n+'</span>';
    html += '<span class="summary-cat">'+cat+'</span>';
    html += '</div>';
  });
  html += '</div></div></div>';

  /* ② 방향성 */
  var cats = idxs.map(catOf);
  var gN = cats.filter(function(c){ return GROWTH.indexOf(c)>=0; }).length;
  var stN = cats.filter(function(c){ return STABILITY.indexOf(c)>=0; }).length;
  var indN = cats.filter(function(c){ return INDIVIDUAL.indexOf(c)>=0; }).length;
  var socN = cats.filter(function(c){ return SOCIAL.indexOf(c)>=0; }).length;

  html += '<div class="sec">';
  html += '<div class="sec-label">방향성</div>';
  html += '<div class="sec-card">';
  html += axisHTML('성장','안정', gN, stN);
  html += axisHTML('개인','사회', indN, socN);
  html += '</div></div>';

  /* ③ 컬러 해석 */
  var counts = {};
  cats.forEach(function(c){ counts[c] = (counts[c]||0)+1; });
  var dom = cats[0], domN = 0;
  Object.keys(counts).forEach(function(k){ if(counts[k]>domN){ domN=counts[k]; dom=k; } });
  var domCol = COL[dom] || '#888';
  var interp = CAT_INTERP[dom];

  html += '<div class="sec">';
  html += '<div class="sec-label">에너지 타입</div>';
  html += '<div class="sec-card">';
  html += '<div class="color-header">';
  html += '<div class="color-circle" style="background:'+domCol+'"></div>';
  html += '<div><div class="color-title">'+dom+'</div><div class="color-sub">지금 나를 움직이는 에너지</div></div>';
  html += '</div>';
  if(interp){
    html += '<div class="color-statement">'+interp.s+'</div>';
    html += '<div class="color-tags">';
    interp.p.forEach(function(t){ html += '<span class="color-tag">'+t+'</span>'; });
    html += '</div>';
  }
  html += '</div></div>';

  /* ④ 상황별 해석 */
  var ctxKey = THEME_CTX_KEY[theme] || 'life';
  var ctxInterp = CTX_INTERP[dom];
  var ctxText = ctxInterp ? ctxInterp[ctxKey] : null;

  if(ctxText){
    var themeKor = theme === 'love' ? '연애' : theme === 'career' ? '진로' : '인생';
    html += '<div class="sec">';
    html += '<div class="sec-label">'+themeKor+' 맥락 해석</div>';
    html += '<div class="sec-card">';
    html += '<p class="ctx-interp">'+ctxText+'</p>';
    html += '</div></div>';
  }

  /* 캡처 안내 */
  html += '<div class="capture-box">';
  html += '<span class="capture-icon">📸</span>';
  html += '<div class="capture-text"><strong>오늘의 가치관을 기록해두세요</strong>';
  html += '이 화면을 캡처하면 지금 나를 움직이는 가치들을 나중에 다시 돌아볼 수 있어요. 시간이 지나 다시 탐색했을 때 어떻게 달라졌는지 비교해보는 것도 좋아요.';
  html += '</div></div>';

  /* 다시하기 */
  html += '<a class="reset-btn" href="library-choice.html">↩ 다시 탐색하기</a>';

  main.innerHTML = html;
}

function axisHTML(leftLbl, rightLbl, leftN, rightN){
  var tot = leftN + rightN;
  var pct = tot > 0 ? Math.round(rightN/tot*100) : 50;
  var fillLeft = Math.min(pct,50);
  var fillW = Math.abs(pct-50);
  var lean;
  if(tot===0) lean='균형';
  else if(pct<42) lean=leftLbl;
  else if(pct>58) lean=rightLbl;
  else lean='균형';
  var note = tot===0
    ? '이 축에 해당하는 가치가 없어요.'
    : '<b>'+leftLbl+'</b> '+leftN+' · <b>'+rightLbl+'</b> '+rightN+' — 당신의 가치들은 <b>'+lean+'</b>'+(lean==='균형'?' 지점에':' 쪽으로')+' 기울어 있어요.';

  return '<div class="axis">'+
    '<div class="axis-labels">'+
      '<span class="'+(lean===leftLbl?'':'dim')+'"><b>'+leftLbl+'</b></span>'+
      '<span class="'+(lean===rightLbl?'':'dim')+'"><b>'+rightLbl+'</b></span>'+
    '</div>'+
    '<div class="axis-track">'+
      '<div class="axis-fill" style="left:'+fillLeft+'%;width:'+fillW+'%;"></div>'+
      '<div class="axis-marker" style="left:'+pct+'%;"></div>'+
    '</div>'+
    '<div class="axis-note">'+note+'</div>'+
  '</div>';
}

render();
</script>
</body>
</html>
